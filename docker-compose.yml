version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: vpn-postgres
    environment:
      POSTGRES_DB: vpn_db
      POSTGRES_USER: vpn_user
      POSTGRES_PASSWORD: vpn_password
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_user -d vpn_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  vpnbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpn-bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: 
      DATABASE_URL: postgres://vpn_user:vpn_password@postgres:5432/vpn_db?sslmode=disable
      REMNAWAVE_PANEL_URL: 
      REMNAWAVE_API_TOKEN: 
      REMNAWAVE_SQUAD_ID: 
      CRYPTO_PAY_API_TOKEN: 
      CRYPTO_PAY_TESTNET: 
      TELEGRAM_ADMIN_ID: 
      GUIDE_TEXT:
